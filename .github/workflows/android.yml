name: Android APK (Kotlin)
# Release signing: CI reads KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD from GitHub Secrets (verified SHA-1 check on every release build).

on:
  push:
    paths:
      - 'android/**'
      - 'supabase/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # Monotonic per workflow, so every CI build gets a higher versionCode than the previous one.
      VERSION_CODE: ${{ github.run_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare release keystore (from GitHub Secrets)
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::warning::Release signing secrets are missing (KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD). Only the debug APK is built; the GitHub Release step is skipped."
            echo "has=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "has=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          # Surface the actual compiler/Gradle errors as annotations (readable via the API).
          grep -E "^e: |What went wrong|Could not|FAILURE" -A4 build.log | head -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g' > errors.txt
          echo "::error::$(cat errors.txt)"
          exit $rc

      - name: Unit tests (parsers, backup, budgets, voucher checksum)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Check release keystore opens with the secrets
        if: steps.ks.outputs.has == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Prints only pass/fail; no secret values are written to the log.
          if ! openssl pkcs12 -in "$KEYSTORE_PATH" -passin env:STORE_PASSWORD -noout 2> ks_err.txt; then
            echo "::error::Keystore cannot be opened with STORE_PASSWORD (wrong password or corrupt KEYSTORE_BASE64): $(tr '\n' ' ' < ks_err.txt | head -c 300)"
            exit 1
          fi
          if ! openssl pkcs12 -in "$KEYSTORE_PATH" -passin env:STORE_PASSWORD -nocerts -nodes -out "$RUNNER_TEMP/key.pem" 2> ks_err.txt; then
            echo "::error::Private key cannot be read with STORE_PASSWORD: $(tr '\n' ' ' < ks_err.txt | head -c 300)"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/key.pem"
          echo "Keystore opens with the store password."
          if [ "$KEY_PASSWORD" = "$STORE_PASSWORD" ]; then echo "KEY_PASSWORD matches STORE_PASSWORD."; else echo "::warning::KEY_PASSWORD differs from STORE_PASSWORD (PKCS12 usually needs them equal)."; fi

      - name: Build signed release APK
        if: steps.ks.outputs.has == 'true'
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace > release.log 2>&1
          rc=$?
          grep -E "^e: |What went wrong|Could not|FAILURE|[Ss]igning|[Kk]eystore|[Pp]assword" -A4 release.log | head -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g' > rerr.txt
          if [ $rc -ne 0 ]; then echo "::error::$(cat rerr.txt)"; fi
          exit $rc

      - name: Verify signature matches the release keystore
        if: steps.ks.outputs.has == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          # SHA-1 of the certificate that signed the APK (public information).
          "$APKSIGNER" verify --print-certs "$APK" > cert.txt 2>&1
          apk_sha1=$(grep 'certificate SHA-1 digest' cert.txt | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          ks_sha1=$(openssl pkcs12 -in "$KEYSTORE_PATH" -passin env:STORE_PASSWORD -nokeys -clcerts 2>/dev/null | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
          echo "::notice::Keystore SHA-1 = ${ks_sha1:-<empty>}"
          echo "::notice::APK signer SHA-1 = ${apk_sha1:-<empty>} (apksigner: ${APKSIGNER:-not found})"
          if [ -z "$apk_sha1" ] || [ -z "$ks_sha1" ] || [ "$apk_sha1" != "$ks_sha1" ]; then
            echo "::error::Signature mismatch or unreadable. apksigner says: $(tr '\n' ' ' < cert.txt | head -c 400)"
            exit 1
          fi
          echo "SHA-1 match: $apk_sha1"
          cp "$APK" "$RUNNER_TEMP/FinTrack.apk"

      - name: Publish GitHub Release (v<versionName>-<versionCode>)
        if: steps.ks.outputs.has == 'true'
        run: |
          VN=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          TAG="v${VN}-${VERSION_CODE}"
          APK="$RUNNER_TEMP/FinTrack.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "FinTrack $VN ($VERSION_CODE)" --notes "Signed release build from CI run ${GITHUB_RUN_NUMBER}. Asset: FinTrack.apk"
          fi
          echo "Release: $TAG"

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FinTracks-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
