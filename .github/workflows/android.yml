name: Android APK (Kotlin)

on:
  push:
    paths:
      - 'android/**'
      - 'supabase/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1
          rc=$?
          # Surface the actual compiler/Gradle errors as annotations (readable via the API).
          grep -E "^e: |What went wrong|Could not|FAILURE" -A4 build.log | head -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g' > errors.txt
          echo "::error::$(cat errors.txt)"
          exit $rc

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinTracks-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
